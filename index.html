<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索世界 - 旅遊景點介紹</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">探索世界</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#destinations">熱門景點</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">關於我們</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">聯絡資訊</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 首頁輪播 -->
    <section id="home" class="hero-section">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://source.unsplash.com/1600x900/?travel,landscape" class="d-block w-100" alt="旅遊景點">
                    <div class="carousel-caption">
                        <h1>探索世界的美好</h1>
                        <p>尋找屬於你的完美旅程</p>
                    </div>
                </div>
                <!-- 更多輪播項目可以在這裡添加 -->
            </div>
        </div>
    </section>

    <!-- 熱門景點 -->
    <section id="destinations" class="py-5">
        <div class="container">
            <h2 class="text-center mb-5" data-aos="fade-up">熱門景點推薦</h2>
            <div class="row">
                <!-- 景點卡片 1 -->
                <div class="col-md-4 mb-4" data-aos="fade-up">
                    <div class="card">
                        <img src="https://source.unsplash.com/800x600/?japan" class="card-img-top" alt="日本">
                        <div class="card-body">
                            <h5 class="card-title">日本</h5>
                            <p class="card-text">體驗日本獨特的文化與現代科技的完美融合。</p>
                        </div>
                    </div>
                </div>
                <!-- 景點卡片 2 -->
                <div class="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="100">
                    <div class="card">
                        <img src="https://source.unsplash.com/800x600/?paris" class="card-img-top" alt="巴黎">
                        <div class="card-body">
                            <h5 class="card-title">法國</h5>
                            <p class="card-text">探索浪漫之都巴黎的藝術與美食。</p>
                        </div>
                    </div>
                </div>
                <!-- 景點卡片 3 -->
                <div class="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="200">
                    <div class="card">
                        <img src="https://source.unsplash.com/800x600/?taiwan" class="card-img-top" alt="台灣">
                        <div class="card-body">
                            <h5 class="card-title">台灣</h5>
                            <p class="card-text">感受寶島台灣的自然風光與美食文化。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 關於我們 -->
    <section id="about" class="py-5 bg-light">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6" data-aos="fade-right">
                    <h2>關於我們</h2>
                    <p>我們致力於為您提供最優質的旅遊資訊，讓每一次旅程都充滿驚喜與回憶。</p>
                </div>
                <div class="col-md-6" data-aos="fade-left">
                    <img src="https://source.unsplash.com/800x600/?travel" class="img-fluid rounded" alt="關於我們">
                </div>
            </div>
        </div>
    </section>

    <!-- 聯絡資訊 -->
    <section id="contact" class="py-5">
        <div class="container">
            <h2 class="text-center mb-5" data-aos="fade-up">聯絡我們</h2>
            <div class="row justify-content-center">
                <div class="col-md-6" data-aos="fade-up">
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="您的名字">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="電子郵件">
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="5" placeholder="您的訊息"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">送出訊息</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2025 探索世界。保留所有權利。</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
